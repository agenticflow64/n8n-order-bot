<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказы — n8n-order-bot</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --green: #1a7f37;
    --amber: #9a6700;
    --red: #cf222e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  a.chat-link { color: var(--accent); text-decoration: none; margin-left: auto; font-size: 13px; }
  a.chat-link:hover { text-decoration: underline; }

  .summary { display: flex; flex-wrap: wrap; gap: 4px 20px; padding: 10px 0; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
  .summary b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .dot-new { background: var(--green); }
  .dot-confirmed { background: var(--accent); }
  .dot-in_progress { background: var(--amber); }
  .dot-done { background: #8c959f; }
  .dot-cancelled { background: var(--red); }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  select, input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font: inherit;
    font-size: 13px;
  }
  input { min-width: 220px; }
  button {
    background: var(--accent);
    color: #ffffff;
    font-weight: 500;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
  }
  button:hover { background: #0860ca; }
  button.ghost { background: var(--bg-subtle); color: var(--text); border-color: var(--border); }
  button.ghost:hover { background: #eef1f4; }

  table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; background: var(--bg-subtle); border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: var(--bg-subtle); }
  tr:last-child td { border-bottom: 0; }
  td.num { white-space: nowrap; }
  td .muted { color: var(--muted); font-size: 12px; }
  td.details { max-width: 300px; }
  td.details .raw { color: var(--muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }

  .u-low { color: var(--muted); } .u-normal { color: var(--text); }
  .u-high { color: var(--amber); } .u-urgent { color: var(--red); font-weight: 600; }

  select.status { min-width: 120px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .flash { animation: flash 1.2s ease; }
  @keyframes flash { 0% { background: #ddf4ff; } 100% { background: transparent; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Заказы</h1>
    <span class="sub">n8n-order-bot, демо без авторизации, только localhost</span>
    <a class="chat-link" href="/chat" target="_blank">Эмулятор чата</a>
  </header>

  <div class="summary" id="summary"></div>

  <div class="bar">
    <select id="f-status">
      <option value="">все статусы</option>
      <option value="new">новые</option>
      <option value="confirmed">подтверждённые</option>
      <option value="in_progress">в работе</option>
      <option value="done">выполненные</option>
      <option value="cancelled">отменённые</option>
    </select>
    <select id="f-source">
      <option value="">все источники</option>
      <option value="emulator">эмулятор</option>
      <option value="telegram">telegram</option>
      <option value="admin">admin</option>
    </select>
    <input id="f-service" type="search" placeholder="услуга содержит…">
    <button id="btn-refresh">Обновить</button>
    <button class="ghost" id="btn-auto">Авто: вкл</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>№</th><th>Услуга / детали</th><th>Клиент</th><th>Срочность</th>
        <th>Источник</th><th>Статус</th><th>Создан</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Заказов пока нет — отправьте сообщение в <a href="/chat" target="_blank" style="color:var(--accent)">эмуляторе чата</a> или боту в Telegram.</div>
</div>

<script>
const STATUS_LABEL = {new:'новый', confirmed:'подтверждён', in_progress:'в работе', done:'выполнен', cancelled:'отменён'};
const URGENCY_LABEL = {low:'не срочно', normal:'обычная', high:'высокая', urgent:'срочно'};
let autoTimer = null;

function fmtDT(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

async function loadStats() {
  const s = await api('/api/stats');
  const parts = [`Всего <b>${s.total}</b>`].concat(Object.entries(s.by_status)
    .filter(([, v]) => v > 0)
    .map(([k, v]) => `<span><span class="dot dot-${k}"></span>${STATUS_LABEL[k] || k} <b>${v}</b></span>`));
  document.getElementById('summary').innerHTML = parts.join('');
}

async function loadOrders() {
  const params = new URLSearchParams();
  const st = document.getElementById('f-status').value;
  const src = document.getElementById('f-source').value;
  const svc = document.getElementById('f-service').value.trim();
  if (st) params.set('status', st);
  if (src) params.set('source', src);
  if (svc) params.set('service_type', svc);
  const orders = await api('/orders?' + params.toString());
  const tbody = document.getElementById('rows');
  document.getElementById('empty').hidden = orders.length > 0;
  tbody.innerHTML = orders.map(o => {
    const details = Object.entries(o.fields || {}).slice(0, 4)
      .map(([k, v]) => `<div>${k}: ${String(v)}</div>`).join('');
    return `<tr id="row-${o.id}">
      <td class="num">${o.id}</td>
      <td class="details"><b>${esc(o.service_type)}</b>${details ? '<div class="muted">'+details+'</div>' : ''}
        <div class="raw" title="${escAttr(o.raw_text)}">${esc(o.raw_text)}</div></td>
      <td>${esc(o.customer_name || '—')}<div class="muted">${esc(o.contact || '')}</div></td>
      <td class="u-${o.urgency}">${URGENCY_LABEL[o.urgency] || o.urgency}</td>
      <td><span class="muted">${o.source}</span></td>
      <td><select class="status" data-id="${o.id}" onchange="setStatus(${o.id}, this.value)">
        ${Object.keys(STATUS_LABEL).map(s =>
          `<option value="${s}" ${s === o.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
      </select></td>
      <td class="muted">${fmtDT(o.created_at)}</td>
    </tr>`;
  }).join('');
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }

async function setStatus(id, status) {
  try {
    await api(`/orders/${id}`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})});
    document.querySelector(`#row-${id}`)?.classList.add('flash');
    await loadStats();
  } catch (e) {
    alert('Не удалось изменить статус: ' + e.message);
    loadOrders();
  }
}

document.getElementById('btn-refresh').onclick = () => { loadOrders(); loadStats(); };
document.getElementById('f-status').onchange = loadOrders;
document.getElementById('f-source').onchange = loadOrders;
document.getElementById('f-service').oninput = loadOrders;

const btnAuto = document.getElementById('btn-auto');
function setAuto(on) {
  clearInterval(autoTimer);
  if (on) { autoTimer = setInterval(() => { loadOrders(); loadStats(); }, 7000); btnAuto.textContent = 'Авто: вкл'; }
  else btnAuto.textContent = 'Авто: выкл';
}
btnAuto.onclick = () => setAuto(btnAuto.textContent.includes('выкл'));

loadOrders(); loadStats(); setAuto(true);
</script>
</body>
</html>
