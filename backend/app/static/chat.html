<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат с ботом — n8n-order-bot</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --green: #1a7f37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-subtle);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; min-height: 100vh; padding: 20px 12px;
  }
  .window {
    width: 100%; max-width: 480px; display: flex; flex-direction: column;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    height: calc(100vh - 40px); min-height: 560px;
  }
  .head {
    background: var(--bg-subtle); padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 6px; background: var(--bg);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .head .name { font-weight: 600; }
  .head .status { color: var(--muted); font-size: 12px; }
  .head .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 4px; }
  .settings-toggle {
    margin-left: auto; background: none; border: 0; color: var(--accent);
    font-size: 13px; cursor: pointer; padding: 4px 6px; font: inherit;
  }
  .settings-toggle:hover { text-decoration: underline; }
  .settings {
    background: var(--bg-subtle); border-bottom: 1px solid var(--border); padding: 10px 14px; display: none;
  }
  .settings.open { display: block; }
  .settings label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 3px; }
  .settings input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  .settings .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .messages { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
  .msg {
    max-width: 82%; padding: 7px 11px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
    font-size: 14px;
  }
  .msg.in { background: var(--bg-subtle); border: 1px solid var(--border); align-self: flex-start; }
  .msg.out { background: #ddf4ff; border: 1px solid #a7cff2; align-self: flex-end; }
  .msg .confirm-btn {
    display: block; margin-top: 8px; background: var(--accent); color: #ffffff; font-weight: 500;
    border: 1px solid transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer; width: 100%; font: inherit;
  }
  .msg .confirm-btn:hover { background: #0860ca; }
  .msg .confirmed-note { display: block; margin-top: 8px; color: var(--green); font-size: 13px; }
  .typing { color: var(--muted); align-self: flex-start; padding: 2px 11px; font-style: italic; font-size: 13px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px 0; }
  .chip {
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; font: inherit;
  }
  .chip:hover { background: var(--bg-subtle); color: var(--text); }
  .composer { display: flex; gap: 8px; padding: 10px 12px 12px; }
  .composer textarea {
    flex: 1; resize: none; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font: inherit; height: 44px; max-height: 120px;
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .composer button {
    background: var(--accent); color: #ffffff; font-weight: 500; border: 1px solid transparent; border-radius: 6px;
    padding: 0 14px; cursor: pointer; font: inherit;
  }
  .composer button:hover { background: #0860ca; }
  .composer button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="window">
  <div class="head">
    <div class="avatar">Б</div>
    <div>
      <div class="name">Order Bot</div>
      <div class="status"><span class="dot"></span>на связи</div>
    </div>
    <button class="settings-toggle" id="btn-settings">Настройки</button>
  </div>
  <div class="settings" id="settings">
    <label>Webhook n8n (workflow должен быть активен)</label>
    <input id="inp-webhook" value="http://localhost:5678/webhook/order-bot">
    <label>Backend</label>
    <input id="inp-backend" value="http://localhost:8000">
    <div class="hint">Тестовый режим ноды Webhook: замените путь на /webhook-test/order-bot и нажмите «Listen for test event» в n8n.</div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chips" id="chips"></div>
  <div class="composer">
    <textarea id="inp" placeholder="Напишите заказ в свободной форме…" rows="1"></textarea>
    <button id="btn-send">Отправить</button>
  </div>
</div>

<script>
const SAMPLES = [
  "привет, надо стрижку собаке на выходные, зовут Бобик, телефон 89161234567. срочно!!",
  "ноут асус x515 не включается вообще(( можно на этой неделе? мой номер 8-921-333-44-55, зовут Дима",
  "ТЕЧЁТ КРАН НА КУХНЕ!!! СРОЧНО ПЛИЗ(( звоните 89167778899",
  "хочу записаться к косметологу на чистку лица, мне советовали Анну. завтра есть окошко?",
  "а вы вообще чё за контора??",
];

const messages = document.getElementById('messages');
const inp = document.getElementById('inp');
const btnSend = document.getElementById('btn-send');
let busy = false;

function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function scroll() { messages.scrollTop = messages.scrollHeight; }

function addMsg(text, who) {
  const m = el(`<div class="msg ${who}"></div>`);
  m.textContent = text;
  messages.appendChild(m); scroll();
  return m;
}

function addTyping() {
  const t = el('<div class="typing">бот печатает…</div>');
  messages.appendChild(t); scroll();
  return t;
}

document.getElementById('btn-settings').onclick = () =>
  document.getElementById('settings').classList.toggle('open');

const chips = document.getElementById('chips');
SAMPLES.forEach(s => {
  const c = el(`<button class="chip"></button>`);
  c.textContent = s.length > 46 ? s.slice(0, 44) + '…' : s;
  c.title = s;
  c.onclick = () => { inp.value = s; inp.focus(); };
  chips.appendChild(c);
});

async function send() {
  const text = inp.value.trim();
  if (!text || busy) return;
  busy = true; btnSend.disabled = true;
  addMsg(text, 'out');
  inp.value = '';
  const typing = addTyping();
  const url = document.getElementById('inp-webhook').value.trim().replace(/\/+$/, '');
  const started = performance.now();
  try {
    const r = await fetch(url, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, name: 'Клиент', source: 'emulator' }),
    });
    const data = await r.json().catch(() => ({}));
    typing.remove();
    const secs = ((performance.now() - started) / 1000).toFixed(1);
    const m = addMsg(data.reply || `Обработано за ${secs} с, но ответ без текста`, 'in');
    if (data.order_id && !data.escalated) attachConfirm(m, data.order_id);
  } catch (e) {
    typing.remove();
    addMsg('Не удалось связаться с n8n (' + e.message + ').\nПроверьте: docker compose up, workflow импортирован и активирован (см. README).', 'in');
  } finally {
    busy = false; btnSend.disabled = false;
  }
}

function attachConfirm(msgEl, orderId) {
  const btn = el('<button class="confirm-btn">Подтвердить заказ</button>');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Отправляем…';
    const backend = document.getElementById('inp-backend').value.trim().replace(/\/+$/, '');
    try {
      const r = await fetch(`${backend}/orders/${orderId}/confirm`, {method: 'POST'});
      if (!r.ok) throw new Error(r.status);
      btn.remove();
      const note = el('<span class="confirmed-note">Заказ подтверждён, смотрите в админке</span>');
      msgEl.appendChild(note);
      addMsg(`Принято. Заказ №${orderId} подтверждён, ждём вас.`, 'in');
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Подтвердить заказ (повторить)';
      alert('Не удалось подтвердить: ' + e.message);
    }
  };
  msgEl.appendChild(btn);
}

btnSend.onclick = send;
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

addMsg('Здравствуйте. Напишите, что нужно сделать: оформлю заказ и пришлю сводку.\nНапример: «надо стрижку собаке на выходные, телефон…»', 'in');
</script>
</body>
</html>
