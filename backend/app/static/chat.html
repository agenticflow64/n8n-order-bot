<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Bot — эмулятор Telegram-чата</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent-a: #22d3ee;
    --accent-b: #8b5cf6;
    --grad: linear-gradient(135deg, #22d3ee, #8b5cf6);
    --chat-bg: #17212b;
    --bubble-in: #2b5278;
    --bubble-out: #8b5cf6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; min-height: 100vh; padding: 20px 12px;
  }
  .phone {
    width: 100%; max-width: 480px; display: flex; flex-direction: column;
    background: var(--chat-bg); border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    height: calc(100vh - 40px); min-height: 560px;
  }
  .phone-head {
    background: var(--panel); padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--grad);
    display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none;
  }
  .phone-head .name { font-weight: 700; }
  .phone-head .status { color: var(--accent-a); font-size: 12px; }
  .settings-toggle {
    margin-left: auto; background: none; border: 0; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 4px 8px;
  }
  .settings {
    background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 14px; display: none;
  }
  .settings.open { display: block; }
  .settings label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 3px; }
  .settings input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 13px;
  }
  .settings .hint { color: var(--muted); font-size: 11px; margin-top: 8px; }

  .messages { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg {
    max-width: 82%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word;
    font-size: 14px; position: relative;
  }
  .msg.in { background: var(--bubble-in); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.out { background: var(--bubble-out); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg .confirm-btn {
    display: block; margin-top: 8px; background: #22d3ee; color: #06121f; font-weight: 700;
    border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; width: 100%; font: inherit;
  }
  .msg .confirmed-note { display: block; margin-top: 8px; color: #7ef0c8; font-size: 13px; }
  .typing { color: var(--muted); align-self: flex-start; padding: 4px 12px; font-style: italic; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; }
  .chip {
    background: rgba(34,211,238,.12); color: var(--accent-a); border: 1px solid rgba(34,211,238,.3);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .composer { display: flex; gap: 8px; padding: 10px 12px 14px; }
  .composer textarea {
    flex: 1; resize: none; background: #2b3a4d; color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font: inherit; height: 46px; max-height: 120px;
  }
  .composer button {
    background: var(--grad); color: #06121f; font-weight: 700; border: 0; border-radius: 10px;
    padding: 0 18px; cursor: pointer; font: inherit;
  }
  .composer button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-head">
    <div class="avatar">🤖</div>
    <div>
      <div class="name">Order Bot</div>
      <div class="status" id="bot-status">бот на связи</div>
    </div>
    <button class="settings-toggle" id="btn-settings" title="Настройки подключения">⚙️</button>
  </div>
  <div class="settings" id="settings">
    <label>Webhook n8n (workflow должен быть активен)</label>
    <input id="inp-webhook" value="http://localhost:5678/webhook/order-bot">
    <label>Backend</label>
    <input id="inp-backend" value="http://localhost:8000">
    <div class="hint">Тестовый режим ноды Webhook: замените путь на /webhook-test/order-bot и нажмите «Listen for test event» в n8n.</div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chips" id="chips"></div>
  <div class="composer">
    <textarea id="inp" placeholder="Напишите заказ в свободной форме…" rows="1"></textarea>
    <button id="btn-send">➤</button>
  </div>
</div>

<script>
const SAMPLES = [
  "привет, надо стрижку собаке на выходные, зовут Бобик, телефон 89161234567. срочно!!",
  "ноут асус x515 не включается вообще(( можно на этой неделе? мой номер 8-921-333-44-55, зовут Дима",
  "ТЕЧЁТ КРАН НА КУХНЕ!!! СРОЧНО ПЛИЗ(( звоните 89167778899",
  "хочу записаться к косметологу на чистку лица, мне советовали Анну. завтра есть окошко?",
  "а вы вообще чё за контора??",
];

const messages = document.getElementById('messages');
const inp = document.getElementById('inp');
const btnSend = document.getElementById('btn-send');
let busy = false;

function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function scroll() { messages.scrollTop = messages.scrollHeight; }

function addMsg(text, who) {
  const m = el(`<div class="msg ${who}"></div>`);
  m.textContent = text;
  messages.appendChild(m); scroll();
  return m;
}

function addTyping() {
  const t = el('<div class="typing">🤖 бот печатает…</div>');
  messages.appendChild(t); scroll();
  return t;
}

document.getElementById('btn-settings').onclick = () =>
  document.getElementById('settings').classList.toggle('open');

const chips = document.getElementById('chips');
SAMPLES.forEach(s => {
  const c = el(`<button class="chip"></button>`);
  c.textContent = s.length > 46 ? s.slice(0, 44) + '…' : s;
  c.title = s;
  c.onclick = () => { inp.value = s; inp.focus(); };
  chips.appendChild(c);
});

async function send() {
  const text = inp.value.trim();
  if (!text || busy) return;
  busy = true; btnSend.disabled = true;
  addMsg(text, 'out');
  inp.value = '';
  const typing = addTyping();
  const url = document.getElementById('inp-webhook').value.trim().replace(/\/+$/, '');
  const started = performance.now();
  try {
    const r = await fetch(url, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, name: 'Клиент', source: 'emulator' }),
    });
    const data = await r.json().catch(() => ({}));
    typing.remove();
    const secs = ((performance.now() - started) / 1000).toFixed(1);
    const m = addMsg(data.reply || `✅ Обработано за ${secs} с (ответ без текста)`, 'in');
    if (data.order_id && !data.escalated) attachConfirm(m, data.order_id);
  } catch (e) {
    typing.remove();
    addMsg('⚠️ Не удалось связаться с n8n (' + e.message + ').\nПроверьте: docker compose up, workflow импортирован и активирован (см. README).', 'in');
  } finally {
    busy = false; btnSend.disabled = false;
  }
}

function attachConfirm(msgEl, orderId) {
  const btn = el('<button class="confirm-btn">✅ Подтвердить заказ</button>');
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Отправляем…';
    const backend = document.getElementById('inp-backend').value.trim().replace(/\/+$/, '');
    try {
      const r = await fetch(`${backend}/orders/${orderId}/confirm`, {method: 'POST'});
      if (!r.ok) throw new Error(r.status);
      btn.remove();
      const note = el('<span class="confirmed-note">✔ Заказ подтверждён — смотрите в админке</span>');
      msgEl.appendChild(note);
      addMsg(`Принято! Заказ #${orderId} подтверждён ✅ Ждём вас.`, 'in');
    } catch (e) {
      btn.disabled = false; btn.textContent = '✅ Подтвердить заказ (повторить)';
      alert('Не удалось подтвердить: ' + e.message);
    }
  };
  msgEl.appendChild(btn);
}

btnSend.onclick = send;
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

addMsg('Здравствуйте! 👋 Напишите, что нужно сделать, — я оформлю заказ и пришлю сводку.\nНапример: «надо стрижку собаке на выходные, телефон…»', 'in');
</script>
</body>
</html>
